name: Build packages

# A standalone DraftWorx for Windows and Linux, to download from the run's page and try: unpack it and run draftworx-gui. Nothing to
# install, not even Python. tools/package.py builds it, checks the built program and packs it. These are builds to try, not
# releases: releases and version tags are the Director's (AGENTS.md), so nothing here publishes one.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths: ['tools/package*', '.github/workflows/packages.yml', 'pyproject.toml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: Windows
            os: windows-latest
          - system: Linux
            os: ubuntu-22.04      # an older Ubuntu, because a Linux build runs on systems as new as the one it's built on, or newer
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}      # a pull request's own commit, not a merge of it
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Every library Qt's X11 platform needs has to be here to go into the package, for desktops that don't have them all.
      # Xvfb is a display to check the window on.
      - name: Install Qt's system libraries, and Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0 libxkbcommon-x11-0 xvfb xauth \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1
      - name: Install DraftWorx and PyInstaller
        run: python -m pip install -e ".[dev]"
      - name: Build, check and pack
        id: package
        run: python tools/package.py
      - name: Keep the package
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 30
